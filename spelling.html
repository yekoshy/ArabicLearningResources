<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مُعَلِّمُ الإِمْلَاءِ الصَّغِير - قواعد الإملاء للأطفال</title>
  <meta name="description" content="تطبيق تعليمي تفاعلي لتعليم مبادئ وقواعد الإملاء في اللغة العربية للأطفال بعمر 7 سنوات">
  
  <!-- خطوط عربية جميلة وواضحة جداً للتشكيل -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-body: 'Readex Pro', system-ui, -apple-system, sans-serif;
      --font-naskh: 'Amiri', serif;
      --bg-cream: #FBF9F5;
      --text-main: #334155;
      --primary: #0D9488;
      --primary-light: #CCFBF1;
      --accent-warm: #F59E0B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
      direction: rtl;
      text-align: right;
      padding-bottom: 60px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: white;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid #F1ECE4;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .logo-area h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #0F766E;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-area p {
      color: #64748B;
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .controls-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      background: #F8FAFC;
      border: 1px solid #CBD5E1;
      color: #334155;
      padding: 8px 16px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: #F1F5F9;
      border-color: #94A3B8;
    }

    .btn-primary {
      background: #0D9488;
      border-color: #0F766E;
      color: white;
    }

    .btn-primary:hover {
      background: #0F766E;
    }

    .level-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .level-tab {
      background: white;
      border: 1px solid #E2E8F0;
      padding: 10px 18px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      color: #64748B;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .level-tab.active {
      background: #0D9488;
      color: white;
      border-color: #0D9488;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
    }

    .rules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .rule-card {
      background: white;
      border: 1px solid #F1ECE4;
      border-radius: 18px;
      padding: 22px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .rule-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px -4px rgba(0, 0, 0, 0.08);
      border-color: #0D9488;
    }

    .rule-card.active-card {
      border: 2px solid #0D9488;
      background: #F0FDFA;
    }

    .rule-badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: #E0F2FE;
      color: #0369A1;
      margin-bottom: 12px;
      width: fit-content;
    }

    .rule-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1E293B;
      margin-bottom: 8px;
    }

    .rule-desc {
      font-size: 0.92rem;
      color: #64748B;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .detail-view {
      background: white;
      border: 1px solid #E2E8F0;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
      margin-bottom: 40px;
    }

    .rule-header-full {
      border-bottom: 1px solid #F1F5F9;
      padding-bottom: 24px;
      margin-bottom: 24px;
    }

    .golden-box {
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      border-radius: 16px;
      padding: 18px 24px;
      margin: 20px 0;
      color: #92400E;
      font-size: 1.05rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .mistake-box {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 24px;
      color: #991B1B;
      font-size: 0.95rem;
    }

    .sentences-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #0F766E;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sentence-card {
      background: #FAF9F6;
      border: 1px solid #ECE7DF;
      border-radius: 16px;
      padding: 18px 24px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: all 0.2s;
    }

    .sentence-card:hover {
      background: white;
      box-shadow: 0 6px 16px rgba(0,0,0,0.04);
      border-color: #CBD5E1;
    }

    .sentence-text {
      font-family: var(--font-naskh);
      font-size: 1.65rem;
      font-weight: 600;
      color: #1E293B;
      line-height: 2.2;
      letter-spacing: 0.02em;
    }

    .sentence-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .word-count-badge {
      background: #EFF6FF;
      color: #1D4ED8;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .listen-btn {
      background: #0D9488;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-family: inherit;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .listen-btn:hover {
      background: #0F766E;
    }

    /* Print styles */
    @media print {
      body {
        background: white !important;
        color: black !important;
        padding: 0 !important;
      }
      .no-print, header, .level-tabs, .rules-grid, .controls-bar {
        display: none !important;
      }
      .detail-view {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
      }
      .sentence-card {
        border-bottom: 2px dashed #CBD5E1 !important;
        background: transparent !important;
        margin-bottom: 30px !important;
        padding-bottom: 40px !important;
      }
      .listen-btn, .word-count-badge {
        display: none !important;
      }
      .sentence-text {
        font-size: 2rem !important;
      }
    }
  </style>

 أما إذا خربت الكلمة (لَبَـ...) فهي نون أصلية نكتبها حتماً!","commonMistake":{"wrong":"شكراً نكتبها: شكرن / بيتاً نكتبها: بيتن","right":"شُكْرًا / بَيْتًا","reason":"كتابة التنوين نوناً صريحة من أشهر الأخطاء عند الأطفال."},"examples":[{"word":"كِتَابٌ","note":"تنوين ضم: ضمتان وصوت نون رنان"},{"word":"كِتَابًا","note":"تنوين فتح: فتحتان مع ألف زائدة"},{"word":"كِتَابٍ","note":"تنوين كسر: كسرتان تحت الحرف"},{"word":"شَجَرَةً","note":"تنوين فتح على التاء المربوطة بلا ألف زائدة"}],"colorTheme":{"bg":"bg-sky-50/70","border":"border-sky-200","text":"text-sky-800","badge":"bg-sky-100 text-sky-900","accent":"sky"},"iconName":"Bell","sentences":[{"id":1,"text":"اشْتَرَى خَالِدٌ كِتَابًا مُفِيدًا جِدًّا","cleanText":"اشترى خالد كتابا مفيدا جدا","wordCount":5,"targetWords":["خَالِدٌ","كِتَابًا","مُفِيدًا","جِدًّا"],"explanationNote":"خالدٌ (تنوين ضم)، كتاباً ومفيداً وجداً (تنوين فتح مع ألف زائدة)."},{"id":2,"text":"نَامَ الطِّفْلُ نَوْمًا هَادِئًا عَمِيقًا","cleanText":"نام الطفل نوما هادئا عميقا","wordCount":5,"targetWords":["نَوْمًا","هَادِئًا","عَمِيقًا"],"explanationNote":"نوماً وهادئاً وعميقاً (تنوين فتح متبوع بألف)."},{"id":3,"text":"جَلَسْنَا فِي حَدِيقَةٍ وَاسِعَةٍ جَمِيلَةٍ","cleanText":"جلسنا في حديقة واسعة جميلة","wordCount":5,"targetWords":["حَدِيقَةٍ","وَاسِعَةٍ","جَمِيلَةٍ"],"explanationNote":"تنوين كسر تحت التاء المربوطة في الكلمات الثلاث."},{"id":4,"text":"رَأَيْتُ عُصْفُورًا صَغِيرًا فَوْقَ غُصْنٍ","cleanText":"رأيت عصفورا صغيرا فوق غصن","wordCount":5,"targetWords":["عُصْفُورًا","صَغِيرًا","غُصْنٍ"],"explanationNote":"عصفوراً وصغيراً (تنوين فتح)، غصنٍ (تنوين كسر)."},{"id":5,"text":"سَمِعْتُ خَبَرًا سَارًّا هَذَا المَسَاءِ","cleanText":"سمعت خبرا سارا هذا المساء","wordCount":5,"targetWords":["خَبَرًا","سَارًّا"],"explanationNote":"خبراً وساراً (تنوين فتح ينطق نوناً ويكتب ألف تنوين)."},{"id":6,"text":"أَكَلَ عُمَرُ خُبْزًا طَازَجًا وَعَسَلًا","cleanText":"أكل عمر خبزا طازجا وعسلا","wordCount":5,"targetWords":["خُبْزًا","طَازَجًا","وَعَسَلًا"],"explanationNote":" :"CheckCircle2","sentences":[{"id":1,"text":"زَرَعَتْ فَاطِمَةُ شَجَرَةً مُثْمِرَةً جَمِيلَةً","cleanText":"زرعت فاطمة شجرة مثمرة جميلة","wordCount":5,"targetWords":["زَرَعَتْ","فَاطِمَةُ","شَجَرَةً","مُثْمِرَةً","جَمِيلَةً"],"explanationNote":"زرعت (تاء مفتوحة)، فاطمة، شجرة، مثمرة، جميلة (تاء مربوطة)."},{"id":2,"text":"غَسَلْتُ وَجْهِي بِالمَاءِ البَارِدِ صَبَاحًا","cleanText":"غسلت وجهي بالماء البارد صباحا","wordCount":5,"targetWords":["غَسَلْتُ","وَجْهِي"],"explanationNote":"غسلتُ (تاء مفتوحة في الفعل)، وجهي (أصلها وجه بالهاء)."},{"id":3,"text":"كَتَبَتْ عَائِشَةُ وَاجِبَاتِ المَدْرَسَةِ كُلَّهَا","cleanText":"كتبت عائشة واجبات المدرسة كلها","wordCount":5,"targetWords":["كَتَبَتْ","عَائِشَةُ","وَاجِبَاتِ","المَدْرَسَةِ"],"explanationNote":"كتبت وواجبات (تاء مفتوحة)، عائشة والمدرسة (تاء مربوطة)."},{"id":4,"text":"رَكِبْتُ السَّيَّارَةَ الجَدِيدَةَ مَعَ أَبِي","cleanText":"ركبت السيارة الجديدة مع أبي","wordCount":5,"targetWords":["رَكِبْتُ","السَّيَّارَةَ","الجَدِيدَةَ"],"explanationNote":"ركبتُ (تاء مفتوحة)، السيارة والجديدة (تاء مربوطة)."},{"id":5,"text":"فَتَحَتِ البِنْتُ حَقِيبَةَ السَّفَرِ الصَّغِيرَةَ","cleanText":"فتحت البنت حقيبة السفر الصغيرة","wordCount":5,"targetWords":["فَتَحَتِ","البِنْتُ","حَقِيبَةَ","الصَّغِيرَةَ"],"explanationNote":"فتحت والبنت (تاء مفتوحة)، حقيبة والصغيرة (تاء مربوطة)."},{"id":6,"text":"أَحَبَّ الطِّفْلُ لُعْبَتَهُ الَّتِي اشْتَرَاهَا","cleanText":"أحب الطفل لعبته التي اشتراها","wordCount":5,"targetWords":["لُعْبَتَهُ"],"explanationNote":"لعبته: تاء مربوطة متبوعة بهاء الغائب (لعبة + هـ)."},{"id":7,"text":"جَلَسَتِ الأُسْرَةُ حَوْلَ مَائِدَةِ الطَّعَامِ","cleanText":"جلست الأسرة حول مائدة الطعام","wordCount":5,"targetWords":["جَلَسَتِ","الأُسْرَةُ","مَائِدَةِ"],"explanationNote":"جلست (مفتوحة)، الأسرة ومائدة (مربوطة)."},{"id":8,"text":"انْتَهَتْ حَفْلَةُ المَدْرَسَةِ بِنَجَاحٍ بَاهِرٍ","cleanText":"انتهت حفلة المدرسة بنجاح باهر","wordCount":5,"targetWords":["انْتَهَتْ","حَفْلَةُ","المَدْرَسَةِ"],"explanationNote":"انتهت (مفتوحة)، حفلة والمدرسة (مربوطة)."},{"id":9,"text":"حَفِظَ عُمَرُ صَلَاتَهُ فِي المَسْجِدِ","cleanText":"حفظ عمر صلاته في المسجد","wordCount":5,"targetWords":["صَلَاتَهُ"],"explanationNote":"صلاته: أصلها صلاة (تاء مربوطة أصبحت تاء عادية مع هاء الضمير)."},{"id":10,"text":"نَامَتِ القِطَّةُ الأَلِيفَةُ فَوْقَ السَّرِيرِ","cleanText":"نامت القطة الأليفة فوق السرير","wordCount":5,"targetWords":["نَامَتِ","القِطَّةُ","الأَلِيفَةُ"],"explanationNote":"نامت (تاء مفتوحة)، القطة والأليفة (تاء مربوطة)."}]},{"id":"hamzat-wasl-qat","number":6,"level":2,"levelName":"المُسْتَوَى 2: التَّاءَاتُ وَالهَمَزَاتُ الأُولَى","title":"هَمْزَةُ الوَصْلِ وَهَمْزَةُ القَطْعِ","shortSummary":"همزة القطع تنطق وتكتب دائماً (أ / إ)، وهمزة الوصل نكتبها ألفاً مجردة (ا) وتسقط عند الوصل.","detailedExplanation":"الهمزة في أول الكلمة نوعان:\n1. همزة القطع (أَ / أُ / إِ): قوية وواضحة، تُنطق وتُكتب فوق الألف أو تحتها سواء كانت في أول الجملة أو في وسطها (أَحْمَدُ، أُسْرَة، إِيمَان).\n2. همزة الوصل (ا): لطيفة ومسالمة، تُنطق فقط إذا بدأنا بها الكلام (اِسْتَمِعْ)، لكن إذا سبقتها كلمة أو حرف فإنها تسقط في النطق ونقفز من الحرف السابق للحرف الذي بعدها مباشرة، وتُكتب ألفاً قائمة دون همزة.","goldenRule":"السِّرُّ الذَّهَبِيُّ (سِرُّ حَرْفِ الوَاو): ضع حرف (وَ) قبل الكلمة وانطقها؛ إذا نطقت الهمزة إجبارياً فهي قَطْع (وَأَحْمَد -> أ)، وإذا قفزت فوقها فهي وَصْل (وَاسْتَمَعَ -> فستمع = وصل)!","commonMistake":{"wrong":"واكتب نكتبها: وااكتب أو اكتب نكتبها: أكتب (للأمر)","right":"اكْتُبْ / وَأَحْمَدُ","reason":"عدم إجراء اختبار حرف الواو الذهبي."},"examples":[{"word":"أَكْرَمَ","note":"قطع: وَأَكْرَمَ (نطقت الهمزة واضحة، نضع رأس عين أ)"},{"word":"انْطَلَقَ","note":"وصل: وَانْطَلَقَ (وانطلق، لم تنطق، نكتب ألفاً مجردة ا)"},{"word":"ابْنٌ / اسْمٌ","note":"من الأسماء السبعة التي همزتها وصل دائماً"}],"colorTheme":{"bg":"bg-teal-50/70","border":"border-teal-200","text":"text-teal-800","badge":"bg-teal-100 text-teal-900","accent":"teal"},"iconName":"Compass","sentences":[{"id":1,"text":"اسْتَمَعَ أَحْمَدُ إِلَى نَصِيحَةِ مُعَلِّمِهِ","cle tionNote":"فؤاد (الفاء مضمومة فالهمزة على واو)، البراءة (مفتوحة بعد ألف مد فتكتب على السطر)."}]},{"id":"hamza-mutatarrefa","number":8,"level":3,"levelName":"المُسْتَوَى 3: عَرْشُ الهَمَزَاتِ الذَّكِيّ","title":"الهَمْزَةُ المُتَطَرِّفَةُ فِي آخِرِ الكَلِمَةِ","shortSummary":"الهمزة في نهاية الكلمة تتبع حركة الحرف الذي قبلها فقط، ولا تهتم بحركتها هي!","detailedExplanation":"الهمزة المتطرفة تجلس في نهاية الكلمة وتصغي لصديقها الحرف الذي يسبقها مباشرة فقط:\n1. إذا كان ما قبلها مَفْتُوحاً: كُتبت على ألف (قَرَأَ، بَدَأَ).\n2. إذا كان ما قبلها مَضْمُوماً: كُتبت على واو (تَبَاطُؤ، لُؤْلُؤ).\n3. إذا كان ما قبلها مَكْسُوراً: كُتبت على ياء غير منقوطة (شَاطِئ، قَارِئ).\n4. إذا كان ما قبلها سَاكِناً أو حَرْفَ مَدٍّ: كُتبت على السَّطْر وحيدة (مَاء، سَمَاء، ضَوْء، هُدُوء، شَيْء، بُطْء).","goldenRule":"السِّرُّ الذَّهَبِيُّ: لا تنظر أبداً لحركة الهمزة المتطرفة! انظر فقط لحركة الحرف الذي يسبقها واكتبها على ما يناسبه!","commonMistake":{"wrong":"شاطي نكتبها بلا همزة أو شيء نكتبها: شىء على الياء","right":"شَاطِئٌ (همزة على الياء) / شَيْءٌ (همزة على السطر بعد الياء الساكنة)","reason":"الخلط بين الهمزة على الياء والهمزة على السطر بعد حرف ساكن."},"examples":[{"word":"قَرَأَ","note":"الراء مفتوحة -> همزة على ألف"},{"word":"شَاطِئ","note":"الطاء مكسورة -> همزة على ياء"},{"word":"تَبَاطُؤ","note":"الطاء مضمومة -> همزة على واو"},{"word":"سَمَاء / دِفْء","note":"مسبوقة بألف مد أو سكون -> همزة على السطر"}],"colorTheme":{"bg":"bg-cyan-50/70","border":"border-cyan-200","text":"text-cyan-800","badge":"bg-cyan-100 text-cyan-900","accent":"cyan"},"iconName":"Anchor","sentences":[{"id":1,"text":"قَرَأَ مُحَمَّدٌ قِصَّةً عَنِ الشَّاطِئِ","cleanText":"قرأ محمد قصة عن الشاطئ","wordCount":5,"targetWords":["قَرَأَ","الشَّاطِئِ"],"explanationNote":"قرأ (على ألف لأن الراء مفتوحة)، الشاطئ (على ياء لأن الطاء مكسورة)."},{"id":2,"text":"يَسِيرُ القِطَارُ بِبُطْءٍ شَدِيدٍ هُنَا","cleanText":"يسير القطار ببطء شديد هنا","wordCount":5,"targetWords":["بِبُطْءٍ"],"explanationNote":"ببطء: الطاء ساكنة إذن الهمزة ترسم على السطر منفردة."},{"id":3,"text":"تَشِعُّ النُّجُومُ فِي السَّمَاءِ لَيْلًا","cleanText":"تشع النجوم في السماء ليلا","wordCount":5,"targetWords":["السَّمَاءِ"],"explanationNote":"السماء: مسبوقة بألف مد ساكنة فتكتب الهمزة على السطر."},{"id":4,"text":"تَوَضَّأَ خَالِدٌ قَبْلَ صَلَاةِ العَصْرِ","cleanText":"توضأ خالد قبل صلاة العصر","wordCount":5,"targetWords":["تَوَضَّأَ"],"explanationNote":"توضأ: الضاد مفتوحة فتكتب الهمزة على ألف."},{"id":5,"text":"يَخْرُجُ اللُّؤْلُؤُ مِنْ أَعْمَاقِ البَحْرِ","cleanText":"يخرج اللؤلؤ من أعماق البحر","wordCount":5,"targetWords":["اللُّؤْلُؤُ"],"explanationNote":"اللؤلؤ: اللام الثانية مضمومة فتكتب الهمزة الأخيرة على واو."},{"id":6,"text":"شَرِبَ عَلِيٌّ مَاءً عَذْبًا بَارِدًا","cleanText":"شرب علي ماء عذبا باردا","wordCount":5,"targetWords":["مَاءً"],"explanationNote":"ماءً: همزة متطرفة على السطر مع تنوين فتح بدون ألف زائدة."},{"id":7,"text":"يُحِبُّ الأَبُ الهُدُوءَ فِي المَنْزِلِ","cleanText":"يحب الأب الهدوء في المنزل","wordCount":5,"targetWords":["الهُدُوءَ"],"explanationNote":"الهدوء: قبلها واو مد ساكنة فتكتب على السطر."},{"id":8,"text":"بَدَأَ المُعَلِّمُ شَرْحَ الدَّرْسِ الجَدِيدِ","cleanText":"بدأ المعلم شرح الدرس الجديد","wordCount":5,"targetWords":["بَدَأَ"],"explanationNote":"بدأ: الدال مفتوحة فتكتب الهمزة على ألف."},{"id":9,"text":"أَضَاءَ المِصْبَاحُ غُرْفَةَ النَّوْمِ لَيْلًا","cleanText":"أضاء المصباح غرفة النوم ليلا","wordCount":5,"targetWords":["أَضَاءَ"],"explanationNote":"أضاء: قبل الهمزة ألف مد ساكنة فتكتب على السطر."},{"id":10,"text":"كَافَأَ المُدِيرُ الطَّالِبَ المُتَفَوِّقَ أَمْسِ","cleanText":"كافأ المدير الطالب المتفوق أمس","wordCount":5,"targetWords":["كَافَأَ"],"explanationNote":"كافأ: الفاء مفتوحة فتكتب الهمزة على ألف."}]},{"id":"alif-layyina","number":9,"level":4,"levelName":"المُسْتَوَى 4: أَسْرَارُ الإِمْلَاءِ المُمَيَّزَة","title":"الأَلِفُ اللَّيِّنَةُ فِي أُوَاخِرِ الكَلِمَاتِ (ا / ى)","shortSummary":"الألف في آخر الكلمة تكون قائمة (ا) إذا كان أصلها واواً، ومقصورة (ى) إذا كان أصلها ياء.","detailedExplanation":"الألف اللينة هي ألف ساكنة تقع في آخر الكلمة وما قبلها مفتوح، وتُرسم على شكلين:\n1. ألف قائمة ممدودة (ا): مثل (دَعَا، سَمَا، عَصَا).\n2. ألف مقصورة على شكل ياء بدون نقط (ى): مثل (رَمَى، مَشَى، فَتَى).\nولنعرف أصل الألف في الأفعال الثلاثية نحول الفعل إلى المضارع (دَعَا -> يَدْعُو، إذن واو فتكتب ألفاً قائمة)، أو (رَمَى -> يَرْمِي، إذن ياء فتكتب مقصورة ى).","goldenRule":"السِّرُّ الذَّهَبِيُّ (سِرُّ الفِعْلِ المُضَارِع): حوّل الفعل إلى مضارع يبدأ بياء؛ إذا انتهى بواو فاكتبها ألفاً قائمة (يدعو -> دعا)، وإذا انتهى بياء فاكتبها مقصورة (يرمي -> رمى)!","commonMistake":{"wrong":"دعى (دعا) أو رمى نكتبها: رما","right":"دَعَا (مضارعه يدعو) / رَمَى (مضارعه يرمي)","reason":"عدم فحص أصل الألف بالمضارع."},"examples":[{"word":"دَعَا","note":"أصلها واو: يَدْعُو -> كُتبت قائمة (ا)"},{"word":"رَمَى","note":"أصلها ياء: يَرْمِي -> كُتبت مقصورة (ى)"},{"word":"مُسْتَشْفَى","note":"فوق ثلاثة أحرف وغير مسبوقة بياء -> مقصورة (ى)"},{"word":"هَدَايَا","note":"فوق ثلاثة أحرف ومسبوقة بياء -> قائمة (ا) حتى لا تتوالى ياءان"}],"colorTheme":{"bg":"bg-orange-50/70","border":"border-orange-200","text":"text-orange-800","badge":"bg-orange-100 text-orange-900","accent":"orange"},"iconName":"Feather","sentences":[{"id":1,"text":"رَعَى الرَّاعِي الأَغْنَامَ فِي المَرْعَى","cleanText":"رعى الراعي الأغنام في المرعى","wordCount":5,"targetWords":["رَعَى","المَرْعَى"],"explanationNote":"رعى (يرعى/رعيت أصلها ياء)، المرعى (فوق الثلاثي بلا ياء)."},{"id":2,"text":"دَعَا عُمَرُ رَبَّهُ بِكُلِّ خُشُوعٍ","cleanText":"دعا عمر ربه بكل خشوع","wordCount":5,"targetWords":["دَعَا"],"explanationNote":"دعا: كتبت ألفاً قائمة لأن مضارعها يدعو (أصلها واو)."},{"id":3,"text":"مَشَى مُصْطَفَى فِي طَرِيقِ الخَيْرِ","cleanText":"مشى مصطفى في طريق الخير","wordCount":5,"targetWords":["مَشَى","مُصْطَفَى"],"explanationNote":"مشى (يمشي أصلها ياء)، مصطفى (اسم فوق الثلاثي)."},{"id":4,"text":"سَمَا الطَّائِرُ فِي أَعَالِي الفَضَاءِ","cleanText":"سما الطائر في أعالي الفضاء","wordCount":5,"targetWords":["سَمَا"],"explanationNote":"سما: كتبت ألفاً قائمة لأن مضارعها يسمو (أصلها واو)."},{"id":5,"text":"بَنَى أَبِي مَنْزِلًا جَدِيدًا لِلأُسْرَةِ","cleanText":"بنى أبي منزلا جديدا للأسرة","wordCount":5,"targetWords":["بَنَى"],"explanationNote":"بنى: كتبت مقصورة لأن مضارعها يبني (أصلها ياء)."},{"id":6,"text":"نَمَا الزَّرْعُ الجَمِيلُ فِي الحَدِيقَةِ","cleanText":"نما الزرع الجميل في الحديقة","wordCount":5,"targetWords":["نَمَا"],"explanationNote":"نما: كتبت ألفاً قائمة لأن مضارعها ينمو (أصلها واو)."},{"id":7,"text":"جَرَى الفَتَى سَرِيعًا نَحْوَ البَابِ","cleanText":"جرى الفتى سريعا نحو الباب","wordCount":5,"targetWords":["جَرَى","الفَتَى"],"explanationNote":"جرى (يجري أصلها ياء)، الفتى (مثناها فتيان أصلها ياء)."},{"id":8,"text":"رَمَى اللَّاعِبُ الكُرَةَ بِكُلِّ مَهَارَةٍ","cleanText":"رمى اللاعب الكرة بكل مهارة","wordCount":5,"targetWords":["رَمَى"],"explanationNote":"رمى: كتبت مقصورة لأن مضارعها يرمي."},{"id":9,"text":"دَنَا الصَّبَاحُ وَاشْرَقَتِ الشَّمْسُ الدَّافِئَةُ","cleanText":"دنا الصباح واشرقت الشمس الدافئة","wordCount":5,"targetWords":["دَنَا"],"explanationNote":"دنا: كتبت قائمة لأن مضارعها يدنو (أصلها واو)."},{"id":10,"text":"رَجَا الطَّالِبُ النَّجَاحَ فِي امْتِحَانِهِ","cleanText":"رجا الطالب النجاح في امتحانه","wordCount":5,"targetWords":["رَجَا"],"explanationNote":"رجا: كتبت قائمة لأن مضارعها يرجو."}]},{"id":"pronounced-not-written","number":10,"level":4,"levelName":"المُسْتَوَى 4: أَسْرَارُ الإِمْلَاءِ المُمَيَّزَة","title":"كَلِمَاتٌ فِيهَا حُرُوفٌ تُنْطَقُ وَلَا تُكْتَبُ","shortSummary":"كلمات مميزة ننطق فيها ألفاً مدية ولكننا نحذفها في الكتابة مثل أسماء الإشارة.","detailedExplanation":"هناك كلمات شائعة في لغتنا نسمع فيها حرف مد (ألف) باللسان ولكن القاعدة الإملائية تمنعنا من كتابته حفظاً لرسم الكلمة الموروث الجميل:\n1. أسماء الإشارة: هَـٰذَا (نكتبها: هذا)، هَـٰذِهِ (هذه)، هَـٰذَانِ (هذان)، هَـٰؤُلَاءِ (هؤلاء)، ذَٰلِكَ (ذلك).\n2. ألفاظ الجلالة والأسماء الكريمة: الله، الرَّحْمَن، إِلَه.\n3. كلمات أخرى: لَكِنْ، طه، داود (واو واحدة تنطق اثنتين).","goldenRule":"السِّرُّ الذَّهَبِيُّ (سِرُّ الكَلِمَاتِ الذَّكِيَّة): احفظ هذه الكلمات كصورة فوتوغرافية في ذهنك؛ نسمع فيها (هاذا) ولكننا نكتبها بأناقة (هذا) بدون ألف!","commonMistake":{"wrong":"هاذا كتاب / هاؤلاء طلاب / لاكن حضرت","right":"هَذَا كِتَابٌ / هَؤُلَاءِ طُلَّابٌ / لَكِنْ حَضَرْتُ","reason":"كتابة الألف التي تنطق باللسان في أسماء الإشارة وكلمة لكن."},"examples":[{"word":"هَذَا","note":"ننطق ألفاً بعد الهاء ولا نكتبها"},{"word":"هَذِهِ","note":"ننطق ألفاً بعد الهاء ولا نكتبها"},{"word":"هَؤُلَاءِ","note":"ننطق ألفاً بعد الهاء ولا نكتبها"},{"word":"الرَّحْمَن","note":"ننطق ألفاً بعد الميم ولا نكتبها"}],"colorTheme":{"bg":"bg-pink-50/70","border":"border-pink-200","text":"text-pink-800","badge":"bg-pink-100 text-pink-900","accent":"pink"},"iconName":"EyeOff","sentences":[{"id":1,"text":"هَذَا كِتَابٌ جَمِيلٌ وَمُفِيدٌ جِدًّا","cleanText":"هذا كتاب جميل ومفيد جدا","wordCount":5,"targetWords":["هَذَا"],"explanationNote":"هذا: فيها ألف تنطق ولا تكتب بعد الهاء."},{"id":2,"text":"هَذِهِ وَرْدَةٌ حَمْرَاءُ فَوَّاحَةُ العِطْرِ","cleanText":"هذه وردة حمراء فواحة العطر","wordCount":5,"targetWords":["هَذِهِ"],"explanationNote":"هذه: تحذف ألف المد بعد الهاء كتابةً."},{"id":3,"text":"هَؤُلَاءِ أَطْفَالٌ يَلْعَبُونَ فِي الحَدِيقَةِ","cleanText":"هؤلاء أطفال يلعبون في الحديقة","wordCount":5,"targetWords":["هَؤُلَاءِ"],"explanationNote":"هؤلاء: تحذف ألف المد من هاء التنبيه."},{"id":4,"text":"ذَلِكَ نَجْمٌ لَامِعٌ فِي السَّمَاءِ","cleanText":"ذلك نجم لامع في السماء","wordCount":5,"targetWords":["ذَلِكَ"],"explanationNote":"ذلك: ألف مد تنطق بعد الذال ولا تكتب."},{"id":5,"text":"اللهُ هُوَ الرَّحْمَنُ الرَّحِيمُ دَائِمًا","cleanText":"الله هو الرحمن الرحيم دائما","wordCount":5,"targetWords":["اللهُ","الرَّحْمَنُ"],"explanationNote":"لفظ الجلالة والرحمن: حذف ألف المد كتابةً."},{"id":6,"text":"سَمِعْتُ النَّصِيحَةَ لَكِنْ لَمْ أَعْمَلْ","cleanText":"سمعت النصيحة لكن لم أعمل","wordCount":5,"targetWords":["لَكِنْ"],"explanationNote":"لكن: فيها ألف تنطق بعد اللام ولا تكتب أبداً."},{"id":7,"text":"قَرَأَ زَيْدٌ سُورَةَ     let currentRuleId = rules[0].id;
    let currentLevelFilter = 0;
    let baseFontSize = 1.65;

    function renderLevelTabs() {
      // already in html
    }

    function filterLevel(lvl) {
      currentLevelFilter = lvl;
      const tabs = document.querySelectorAll('.level-tab');
      tabs.forEach((tab, idx) => {
        tab.classList.toggle('active', idx === lvl);
      });
      renderRulesGrid();
    }

    function renderRulesGrid() {
      const grid = document.getElementById('rulesGrid');
      grid.innerHTML = '';
      
      const filtered = currentLevelFilter === 0 
        ? rules 
        : rules.filter(r => r.level === currentLevelFilter);

      filtered.forEach(rule => {
        const card = document.createElement('div');
        card.className = 'rule-card' + (rule.id === currentRuleId ? ' active-card' : '');
        card.onclick = () => selectRule(rule.id);
        
        card.innerHTML = `
          <div>
            <span class="rule-badge">${rule.levelName}</span>
            <h3 class="rule-title">${rule.number}. ${rule.title}</h3>
            <p class="rule-desc">${rule.shortSummary}</p>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px;">
            <span style="font-size:0.85rem; color:#0D9488; font-weight:600;">10 جمل مشكولة</span>
            <button class="btn" style="padding:4px 10px; font-size:0.8rem;">تصفح 👈</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function selectRule(ruleId) {
      currentRuleId = ruleId;
      renderRulesGrid();
      renderDetailView();
      // Smooth scroll to detail
      const dv = document.getElementById('detailView');
      if (dv) dv.scrollIntoView({ behavior: 'smooth' });
    }

    function renderDetailView() {
      const rule = rules.find(r => r.id === currentRuleId) || rules[0];
      const dv = document.getElementById('detailView');

      let sentencesHtml = rule.sentences.map((s, idx) => {
        return `
          <div class="sentence-card">
            <div>
              <div class="sentence-text" style="font-size: ${baseFontSize}rem;">${s.text}</div>
              ${s.explanationNote ? `<div style="font-size:0.9rem; color:#64748B; margin-top:6px;">💡 ${s.explanationNote}</div>` : ''}
            </div>
            <div class="sentence-meta">
              <span class="word-count-badge">${s.wordCount} كَلِمَات</span>
              <button class="listen-btn" onclick="speakArabic('${s.text}')">🔊 استمع</button>
            </div>
          </div>
        `;
      }).join('');

      dv.innerHTML = `
        <div class="rule-header-full">
          <span class="rule-badge">${rule.levelName}</span>
          <h2 style="font-size:1.8rem; font-weight:700; color:#0F766E; margin-bottom:12px;">
            القاعدة ${rule.number}: ${rule.title}
          </h2>
          <p style="font-size:1.05rem; color:#475569; line-height:1.8;">
            ${rule.detailedExplanation.replace(/\n/g, '<br>')}
          </p>

          <div class="golden-box">
            <span>✨</span>
            <div>${rule.goldenRule}</div>
          </div>

          <div class="mistake-box">
            <strong>⚠️ احذر من الخطأ الشائع:</strong>
            <div>الخطأ: <span style="text-decoration:line-through;">${rule.commonMistake.wrong}</span> | الصواب: <strong style="color:#059669;">${rule.commonMistake.right}</strong></div>
            <div style="font-size:0.85rem; color:#64748B; margin-top:4px;">السبب: ${rule.commonMistake.reason}</div>
          </div>
        </div>

        <div class="sentences-title">
          <span>📝 الجمل العشر للتدريب الأسبوعي (كل جملة 4 أو 5 كلمات):</span>
          <button class="btn" onclick="speakArabic('${rule.title}')">🔊 قراءة عنوان القاعدة</button>
        </div>

        <div class="sentences-list">
          ${sentencesHtml}
        </div>
      `;
    }

    function changeFontSize(delta) {
      baseFontSize = Math.max(1.2, Math.min(2.5, baseFontSize + (delta * 0.15)));
      const texts = document.querySelectorAll('.sentence-text');
      texts.forEach(el => el.style.fontSize = baseFontSize + 'rem');
    }

    function speakArabic(text) {
      if (!('speechSynthesis' in window)) {
        alert('المتصفح لا يدعم ميزة النطق الصوتي.');
        return;
      }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ar-SA';
      u.rate = 0.8;
      const voices = window.speechSynthesis.getVoices();
      const arVoice = voices.find(v => v.lang.startsWith('ar'));
      if (arVoice) u.voice = arVoice;
      window.speechSynthesis.speak(u);
    }
